<style>
/* layout: 1画面 — 上にお姫様3人のステージ、まんなかにおしゃれ箱、いちばん下に大きな再生ボタン */
:root{
  --sky:#FFF2F7; --stage1:#FFE3EF; --stage2:#F1E6FF; --ink:#6B3A5B;
  --pink:#FF6FA5; --pinkDeep:#D9467F; --line:#F6C9DD; --card:#FFFFFF; --cardSoft:#FFF7FB; --gold:#F5B82E;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-inline:16px;padding-block:8px;max-width:1100px;margin:0 auto}

/* ステージ */
.main{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px}
@media (min-aspect-ratio:1/1){.main{flex-direction:row}.main .stagecol{flex:1.35 1 0}.main .tray{flex:1 1 0}}
.stagecol{flex:1.25 1 0;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.ptabs{flex:none;display:flex;gap:8px;justify-content:center}
.ptab{flex:1 1 0;max-width:110px;height:clamp(48px,8vh,70px);border-radius:18px;border:3px solid var(--line);background:var(--card);cursor:pointer;padding:2px;display:grid;place-items:center;transition:transform .12s}
.ptab svg{height:100%;width:100%;display:block}
.ptab[aria-selected="true"]{background:#FFD3E5;border-color:var(--pinkDeep);transform:translateY(-2px);box-shadow:0 4px 0 #E79AB9}
.ptab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative;flex:1 1 0;min-height:0;min-width:0;display:flex;align-items:stretch;gap:2px;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,var(--stage1),var(--stage2) 68%,#FFE6F1);border:3px solid var(--line)}
.backdrop{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.stage::before{display:none;z-index:0;content:"";position:absolute;left:-10%;right:-10%;bottom:-9%;height:24%;
  background:radial-gradient(ellipse at 50% 40%,#FFC9DF 0,#FFD9E9 45%,transparent 70%)}
.princess{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;padding-block:6px 6px}
.fig{flex:1 1 0;min-height:0;width:100%;perspective:600px}
.dancer,.spinner{height:100%;width:100%}
.dancer{transform-origin:50% 100%;will-change:transform}
.fig svg{width:100%;height:100%;display:block;overflow:visible;touch-action:none;transition:filter .15s;filter:drop-shadow(0 6px 8px rgba(120,40,90,.16))}
.princess.hover .fig svg{filter:drop-shadow(0 0 12px #FFD54A) drop-shadow(0 0 4px #FFF)}
.worn{cursor:grab}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.p1 .eyes{animation-delay:-1.7s}.p2 .eyes{animation-delay:-3.1s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.stk{animation:tw 2.2s ease-in-out infinite}
.playing .pup{animation:pupHop .6s ease-in-out infinite}
.playing .fs.pup{animation:pupHopDiv .6s ease-in-out infinite}
.playing .fs.pup:nth-child(2n){animation-delay:-.3s}
@keyframes pupHop{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes pupHopDiv{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-30%) rotate(8deg)}}
@keyframes tw{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}

/* おどる */
.playing .dancer{animation:hop .9s ease-in-out infinite}
.playing .p1 .dancer{animation-delay:-.3s}.playing .p2 .dancer{animation-delay:-.6s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6%) rotate(-5deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-6%) rotate(5deg)}}
.playing .spinner{animation:twirl 5.4s ease-in-out infinite}
.playing .p1 .spinner{animation-delay:-1.8s}.playing .p2 .spinner{animation-delay:-3.6s}
@keyframes twirl{0%,72%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.playing .arm-l{animation:waveL .9s ease-in-out infinite}
.playing .arm-r{animation:waveR .9s ease-in-out infinite;animation-delay:-.45s}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(58deg)}}
@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(-58deg)}}
.playing .skirt{animation:sway .9s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

.twinkles{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3}
.playing .twinkles{opacity:1}
.twinkles span{position:absolute;width:22px;height:22px;animation:floatUp 3s linear infinite}
@keyframes floatUp{0%{transform:translateY(30px) scale(.4) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) scale(1) rotate(180deg);opacity:0}}

.free{position:absolute;inset:0;z-index:2;pointer-events:none}
.free .fs{position:absolute;pointer-events:auto;touch-action:none;cursor:grab}
.free .fs svg{width:100%;height:100%;display:block}

/* おしゃれ箱 */
.tray{flex:1 1 0;min-height:0;min-width:0;background:var(--card);border-radius:22px;border:3px solid var(--line);padding:8px;display:flex;overflow:hidden}
.items{flex:1 1 0;min-width:0;display:grid;grid-template-columns:repeat(var(--cols,8),var(--tile,56px));grid-auto-rows:var(--tile,56px);gap:var(--gap,6px);justify-content:center;align-content:center}
.tile{border-radius:22%;background:var(--cardSoft);border:2px solid var(--line);box-sizing:border-box;
  display:grid;place-items:center;cursor:grab;touch-action:none;transition:transform .1s}
.tile svg{width:80%;height:80%;display:block;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(120,40,90,.18))}
.tile:active{transform:scale(.9)}
.tile.g1{background:#FFF0F6}.tile.g2{background:#FFF8E1}.tile.g3{background:#F1EEFF}.tile.g4{background:#EAF7FF}.tile.g5{background:#FFF1E2}
.ctl:focus-visible,#play:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ボタン */
.controls{flex:none;display:flex;justify-content:center;align-items:center;gap:22px}
#play{width:clamp(70px,13vw,92px);aspect-ratio:1;border-radius:50%;border:4px solid #fff;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFA3C7,#F0558F 70%);box-shadow:0 6px 0 #C23A72,0 10px 22px rgba(200,60,120,.35);transition:transform .1s}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #C23A72}
#play svg{width:44%;height:44%}
.ctl{width:clamp(48px,8vw,60px);aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--line);cursor:pointer;display:grid;place-items:center;padding:0}
.ctl svg{width:58%;height:58%}
.ctl.shake{animation:wig .18s ease-in-out 3}
.ctl .lid{transform-box:fill-box;transform-origin:0% 100%}
.ctl:active .lid{transform:rotate(-25deg)}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 8px rgba(120,40,90,.3))}
.ghost svg{width:100%;height:100%;display:block}
.fx{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:18px;height:18px;animation:burst .7s ease-out forwards}
@keyframes burst{0%{transform:translate(var(--x0),var(--y0)) scale(.3);opacity:1}100%{transform:translate(var(--x1),var(--y1)) scale(1);opacity:0}}
#measure{position:absolute;left:-9999px;top:0;width:10px;height:10px;visibility:hidden}

@media (prefers-reduced-motion:reduce){
  .stk{animation:none}
  .twinkles span{animation-duration:6s}
}
</style>

<script>
(function(){
const f = n => Math.round(n*10)/10;

/* ---------- 絵のパーツ ---------- */
function starPath(r, ir, n){ ir = ir || r*.48; n = n || 5; let d='';
  for(let i=0;i<n*2;i++){ const rr=i%2?ir:r, a=-Math.PI/2+i*Math.PI/n; d+=(i?'L':'M')+f(rr*Math.cos(a))+','+f(rr*Math.sin(a)); }
  return d+'Z'; }
const starAt=(x,y,r,fill,stroke)=>`<path transform="translate(${x},${y})" d="${starPath(r)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${f(r/7)}" stroke-linejoin="round"`:''}/>`;
const heartPath=s=>`M0,${f(s)} C${f(-1.4*s)},${f(.15*s)} ${f(-.95*s)},${f(-1.05*s)} 0,${f(-.45*s)} C${f(.95*s)},${f(-1.05*s)} ${f(1.4*s)},${f(.15*s)} 0,${f(s)}Z`;
const heartAt=(x,y,s,fill,stroke)=>`<path transform="translate(${x},${y})" d="${heartPath(s)}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="${f(s/6)}" stroke-linejoin="round"`:''}/>`;
function flowerAt(x,y,r,petal,center){ let s='';
  for(let k=0;k<5;k++){ const a=-Math.PI/2+k*2*Math.PI/5; s+=`<circle cx="${f(x+r*.62*Math.cos(a))}" cy="${f(y+r*.62*Math.sin(a))}" r="${f(r*.5)}" fill="${petal}"/>`; }
  return s+`<circle cx="${x}" cy="${y}" r="${f(r*.38)}" fill="${center}"/>`; }
const gemAt=(x,y,r,fill)=>`<path d="M${f(x-r)},${y} L${x},${f(y-r*1.1)} L${f(x+r)},${y} L${x},${f(y+r*1.1)}Z" fill="${fill}" stroke="#ffffff" stroke-width="${f(r/4)}" stroke-linejoin="round"/><path d="M${f(x-r)},${y} L${x},${f(y-r*1.1)} L${x},${y}Z" fill="#fff" opacity=".38"/><path d="M${x},${y} L${f(x+r)},${y} L${x},${f(y+r*1.1)}Z" fill="#000" opacity=".16"/><circle cx="${f(x-r*.3)}" cy="${f(y-r*.35)}" r="${f(r*.22)}" fill="#fff"/>`;
const ball=(x,y,r,fill,stroke)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}"${stroke?` stroke="${stroke}" stroke-width="1"`:''}/>`;

/* ---------- アイテム ---------- */
const ITEMS = {}, BY_CAT = {};
function add(cat,id,main,top){ ITEMS[id]={id,cat,main,top:top||''}; (BY_CAT[cat]=BY_CAT[cat]||[]).push(id); }

// ドレス（原点＝首の下 100,120／腰は y=78）— 6着とも形がちがう
const wrapSkirt=svg=>`<g transform="translate(0,78)"><g class="skirt"><g transform="translate(0,-78)">${svg}</g></g></g>`;
function bodice(c,neck){
  const top = neck==='sweet' ? 'M-27,10 Q-14,0 0,12 Q14,0 27,10' : neck==='square' ? 'M-27,6 L-13,14 L13,14 L27,6' : 'M-27,4 Q0,16 27,4';
  return `<path d="${top} L23,80 Q0,86 -23,80Z" fill="${c.a}" stroke="${c.s}" stroke-width="2" stroke-linejoin="round"/>`;
}
const sash=(c,bow)=>`<rect x="-25" y="72" width="50" height="10" rx="5" fill="${c.t}" stroke="${c.s}" stroke-width="1"/>`+
  (bow?`<path d="M0,77 L-14,68 L-14,86Z M0,77 L14,68 L14,86Z" fill="${c.t}" stroke="${c.s}" stroke-width="1.4" stroke-linejoin="round"/>${ball(0,77,3.6,c.s)}`:'');
const decoAt=(kind,pts,col)=>pts.map(([x,y])=>kind==='dots'?ball(x,y,4.5,col):kind==='stars'?starAt(x,y,7,col):kind==='hearts'?heartAt(x,y,6,col):kind==='flowers'?flowerAt(x,y,8,col,'#FFE066'):gemAt(x,y,4.5,col)).join('');

// 1 ふんわりボールガウン
(()=>{ const c={a:'#FF8FB8',b:'#FFC6DA',t:'#FFFFFF',s:'#E2649A'};

function beadsOn(n,x0,y0,cy,x1,colorFn,r){ let s='';
  for(let i=0;i<n;i++){ const t=i/(n-1), x=(1-t)**2*x0+t*t*x1, y=(1-t)**2*y0+2*(1-t)*t*cy+t*t*y0; s+=ball(x,y,r,colorFn(i),'rgba(0,0,0,.12)'); }
  return s; }

/* ---------- 状態 ---------- */
const KEY='princess-dressup-v1';
const blank=()=>({p:P.map(()=>({stickers:[]})),free:[]});
let state=blank(), playing=false, musicOn=true;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.p)&&s.p.length===3) state=s; }catch(e){} }

/* ---------- 描画 ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage'), freeEl=$('free');
const BB={};
function measureAll(){
  const m=$('measure');
  Object.values(ITEMS).forEach(it=>{
    m.innerHTML=it.icon||(it.main+it.top);
    try{ const b=m.getBBox(); BB[it.id]={x:b.x,y:b.y,w:b.width||20,h:b.height||20}; }catch(e){ BB[it.id]={x:-20,y:-20,w:40,h:40}; }
  });
  m.innerHTML='';
}
function itemSVG(id,pad){ const b=BB[id], it=ITEMS[id]; pad=pad==null?2:pad; const fx=Math.max(b.w,b.h)>80?'puff':'puffS';
  if(it.icon) return `<svg viewBox="${f(b.x-pad)} ${f(b.y-pad)} ${f(b.w+pad*2)} ${f(b.h+pad*2)}"><g filter="url(#${fx})">${it.icon}</g></svg>`;
  return `<svg viewBox="${f(b.x-pad)} ${f(b.y-pad)} ${f(b.w+pad*2)} ${f(b.h+pad*2)}"><g filter="url(#${fx})">${it.main}${it.top}</g></svg>`; }

const figs=[];
function buildStage(){
  P.forEach((p,i)=>{
    const d=document.createElement('div'); d.className='princess p'+i;
    d.innerHTML=`<div class="fig"><div class="dancer"><div class="spinner"></div></div></div>`;
    stage.insertBefore(d,freeEl);
    figs.push({wrap:d,host:d.querySelector('.spinner')});
  });
  const tw=$('twinkles'), cols=['#FFE14D','#FF8FC2','#7CC8FF','#B794F6','#FFFFFF'];
  for(let k=0;k<18;k++){ const s=document.createElement('span');
    s.style.left=(4+Math.random()*92)+'%'; s.style.top=(30+Math.random()*65)+'%'; s.style.animationDelay=(-Math.random()*3)+'s';
    s.innerHTML=`<svg viewBox="-15 -15 30 30">${starAt(0,0,14,cols[k%cols.length])}</svg>`; tw.appendChild(s); }
}
function renderPrincess(i){ figs[i].host.innerHTML=princessSVG(i); }
function svgOf(i){ return figs[i].host.querySelector('svg'); }
function scaleOf(i){ const m=svgOf(i)&&svgOf(i).getScreenCTM(); return m?Math.abs(m.a)||1:1; }
function visScale(){ const i=view==='all'?0:view; return scaleOf(i); }
let view=0;
function headSVG(p,dx){ return `<g transform="translate(${dx||0},0)"><g filter="url(#puff)">${hairBack(p)}</g><circle cx="100" cy="70" r="38" fill="${p.skin}" filter="url(#puff)"/>
  ${face(p).replace('class="eyes"','')}<g filter="url(#puff)">${hairFront(p)}</g>${hairShine(p)}</g>`; }
function renderPTabs(){
  const one=i=>`<svg viewBox="36 6 128 124">${headSVG(P[i])}</svg>`;
  const all=`<svg viewBox="-30 6 260 124"><g transform="translate(100,68) scale(.62) translate(-100,-68)">${headSVG(P[0],-120)}${headSVG(P[2],120)}${headSVG(P[1],0)}</g></svg>`;
  const tabs=[0,1,2,'all'];
  $('ptabs').innerHTML=tabs.map(v=>`<button class="ptab" type="button" role="tab" data-v="${v}" aria-selected="${v===view}" aria-label="${v==='all'?'みんな':P[v].name}">${v==='all'?all:one(v)}</button>`).join('');
}
function setView(v){ view=v; figs.forEach((fg,i)=>{ fg.wrap.hidden=!(v==='all'||v===i); }); renderPTabs(); requestAnimationFrame(renderFree); }
function renderFree(){
  const sc=visScale();
  freeEl.innerHTML='';
  state.free.forEach((k,j)=>{ if(!ITEMS[k.id]) return;
    const bb=BB[k.id], sz=Math.max(34,Math.max(bb.w,bb.h)*1.1)*STICKER_SCALE*sc, d=document.createElement('div'); d.className='fs'+(ITEMS[k.id].cat==='dog'?' pup':''); d.dataset.j=j;
    d.style.width=sz+'px'; d.style.height=sz+'px';
    d.style.left=`calc(${k.fx*100}% - ${sz/2}px)`; d.style.top=`calc(${k.fy*100}% - ${sz/2}px)`;
    d.innerHTML=itemSVG(k.id,2); freeEl.appendChild(d); });
}
function renderAll(){ P.forEach((_,i)=>renderPrincess(i)); renderFree(); }
const GROUP={dress:'g1',crown:'g2',necklace:'g2',earrings:'g2',ring:'g2',shoes:'g3',bag:'g3',star:'g4',heart:'g4',dog:'g5'};
function renderItems(){
  $('items').innerHTML=CATS.map(c=>BY_CAT[c.key].map(id=>`<div class="tile ${GROUP[c.key]}" data-id="${id}" role="button" aria-label="${c.label}">${itemSVG(id,3)}</div>`).join('')).join('');
  fitTiles();
}
// すべてのパーツがスクロールなしで1画面に入る一番大きいマスの大きさを選ぶ
function fitTiles(){
  const el=$('items'), n=el.children.length; if(!n) return;
  const W=el.clientWidth, H=el.clientHeight; if(!W||!H) return;
  let best={s:20,c:8,g:4};
  for(let c=1;c<=n;c++){ const rows=Math.ceil(n/c), g=Math.max(3,Math.min(8,W/c*.08));
    const s=Math.min((W-g*(c-1))/c,(H-g*(rows-1))/rows); if(s>best.s) best={s,c,g}; }
  const s=Math.floor(Math.min(best.s,110));
  el.style.setProperty('--tile',s+'px'); el.style.setProperty('--cols',best.c); el.style.setProperty('--gap',Math.floor(best.g)+'px');
}

/* ---------- 音 ---------- */
let ac=null; const voices=[];
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
  if(ac&&ac.state==='suspended') ac.resume(); return ac; }
function tone(freq,t,dur,vol,type){ const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
  voices.push(o); o.onended=()=>{ const k=voices.indexOf(o); if(k>=0) voices.splice(k,1); }; }
function chime(){ const a=audio(); if(!a) return; const t=a.currentTime; tone(1318.5,t,.18,.12,'sine'); tone(1568,t+.08,.28,.12,'sine'); }
function puff(){ const a=audio(); if(!a) return; const t=a.currentTime; tone(523,t,.12,.08,'sine'); tone(392,t+.06,.16,.07,'sine'); }
// 音名 → 周波数（例 'F#4'）
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function hz(n){ const m=n.match(/^([A-G])(#|b)?(\d)$/); if(!m) return 0;
  const midi=12*(+m[3]+1)+SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,(midi-69)/12); }
const parseMel=str=>str.trim().split(/\s+/).map(t=>{ const [n,b]=t.split(':'); return [n==='R'?0:hz(n), b?+b:1]; });
// 童謡「ちょうちょう」（ハ長調・4拍子）。メロディーは古い外国の民謡で著作権は切れている
const SONGS=[
  { beat:.36, meter:4,
    mel:parseMel('G4 E4 E4:2 F4 D4 D4:2 C4 D4 E4 F4 G4 G4 G4:2 '+
                 'G4 E4 E4:2 F4 D4 D4:2 C4 E4 G4 G4 C4:4 '+
                 'D4 D4 D4 D4 D4 E4 F4:2 E4 E4 E4 E4 E4 F4 G4:2 '+
                 'G4 E4 E4:2 F4 D4 D4:2 C4 E4 G4 G4 C4:4'),
    chords:'C G C C C G C C G G C C C G C C'.split(' ') }
];
const CHORD={C:['C3','E3','G3'],G7:['G2','B3','F4'],F:['F2','A3','C4'],G:['G2','B3','D4'],D:['D3','F#3','A3'],A:['A2','C#4','E4'],A7:['A2','C#4','G4']};
const BEAT=.34; let songTimer=null, songIdx=0;
function scheduleSong(){ const a=audio(); if(!a) return; const S=SONGS[songIdx%SONGS.length]; songIdx++;
  const B=S.beat, t0=a.currentTime+.08; let t=t0;
  S.mel.forEach(([fq,b])=>{ if(fq){ tone(fq,t,b*B*.95,.16,'triangle'); tone(fq*2,t,b*B*.5,.03,'sine'); } t+=b*B; });
  // ズン・チャッ・チャッ の伴奏
  const M=S.meter||3, bassAt=M===4?[0,2]:[0], chordAt=M===4?[1,3]:[1,2];
  S.chords.forEach((c,m)=>{ const ch=CHORD[c]||CHORD.C, tm=t0+m*M*B;
    bassAt.forEach(k=>tone(hz(ch[0])/(ch[0].endsWith('3')?2:1),tm+k*B,B*1.1,.09,'sine'));
    chordAt.forEach(k=>{ tone(hz(ch[1]),tm+k*B,B*.6,.035,'sine'); tone(hz(ch[2]),tm+k*B,B*.6,.035,'sine'); }); });
  const end=Math.max(t,t0+S.chords.length*M*B)+B;
  songTimer=setTimeout(()=>{ if(playing&&musicOn) scheduleSong(); }, (end-a.currentTime-.05)*1000); }
function stopSong(){ clearTimeout(songTimer); songTimer=null; voices.slice().forEach(o=>{ try{o.stop();}catch(e){} }); voices.length=0; }

/* ---------- きらきら ---------- */
function burst(x,y,n,kind){ const cols=['#FFE14D','#FF8FC2','#7CC8FF','#B794F6'];
  for(let k=0;k<n;k++){ const e=document.createElement('div'); e.className='fx';
    const a=Math.random()*Math.PI*2, r=kind==='puff'?30+Math.random()*20:40+Math.random()*40;
    e.style.setProperty('--x0',(x-9)+'px'); e.style.setProperty('--y0',(y-9)+'px');
    e.style.setProperty('--x1',(x-9+Math.cos(a)*r)+'px'); e.style.setProperty('--y1',(y-9+Math.sin(a)*r)+'px');
    e.innerHTML=kind==='puff'?`<svg viewBox="-10 -10 20 20"><circle r="8" fill="#E9DDE6"/></svg>`:`<svg viewBox="-15 -15 30 30">${starAt(0,0,14,cols[k%4])}</svg>`;
    document.body.appendChild(e); setTimeout(()=>e.remove(),750); } }

/* ---------- ドラッグ＆ドロップ ---------- */
let drag=null;
function startDrag(e,id){
  if(drag){ drag.g.remove(); drag=null; }
  document.querySelectorAll('.ghost').forEach(g=>g.remove());
  e.preventDefault(); audio();
  const b=BB[id], sc=visScale()*(CAT_SCALE[ITEMS[id].cat]||1); let w=(b.w+4)*sc, h=(b.h+4)*sc;
  const minS=60, big=Math.max(w,h); if(big<minS){ w*=minS/big; h*=minS/big; }
  const g=document.createElement('div'); g.className='ghost'; g.style.width=w+'px'; g.style.height=h+'px'; g.innerHTML=itemSVG(id,2);
  document.body.appendChild(g); drag={id,g,w,h,pid:e.pointerId}; moveGhost(e.clientX,e.clientY);
}
function moveGhost(x,y){ drag.g.style.transform=`translate(${x-drag.w/2}px,${y-drag.h/2}px)`;
  const hit=princessAt(x,y); figs.forEach((fg,i)=>fg.wrap.classList.toggle('hover',!!hit&&hit.i===i)); }
function princessAt(x,y){
  for(let i=0;i<figs.length;i++){ if(figs[i].wrap.hidden) continue; const s=svgOf(i); if(!s) continue; const m=s.getScreenCTM(); if(!m) continue;
    const pt=s.createSVGPoint(); pt.x=x; pt.y=y; const l=pt.matrixTransform(m.inverse());
    if(l.x>=-8&&l.x<=208&&l.y>=-10&&l.y<=415) return {i,x:l.x,y:l.y}; }
  return null; }
function inside(el,x,y){ const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
function endDrag(x,y){
  if(!drag) return; const {id}=drag; drag.g.remove(); figs.forEach(fg=>fg.wrap.classList.remove('hover')); drag=null;
  const slot=SLOT_OF[ITEMS[id].cat], onTrash=inside($('reset'),x,y), hit=onTrash?null:princessAt(x,y), onTray=onTrash||inside($('tray'),x,y);
  if(slot!=='sticker'){
    if(hit&&!onTray){ state.p[hit.i][slot]=id; chime(); burst(x,y,8); } else { puff(); burst(x,y,6,'puff'); }
  } else if(hit&&!onTray){ state.p[hit.i].stickers.push({id,x:hit.x,y:hit.y}); chime(); burst(x,y,6); }
  else if(!onTrash&&inside(stage,x,y)){ const r=stage.getBoundingClientRect(); state.free.push({id,fx:(x-r.left)/r.width,fy:(y-r.top)/r.height}); chime(); burst(x,y,6); }
  else { puff(); burst(x,y,6,'puff'); }
  renderAll(); save();
}
document.addEventListener('pointermove',e=>{ if(!drag) return;
  if(e.pointerType==='mouse'&&e.buttons===0){ endDrag(e.clientX,e.clientY); return; }
  if(e.pointerId===drag.pid){ e.preventDefault(); moveGhost(e.clientX,e.clientY); } },{passive:false});
window.addEventListener('blur',()=>{ if(drag) endDrag(-9999,-9999); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&drag) endDrag(-9999,-9999); });
document.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(e.clientX,e.clientY); });
document.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) endDrag(e.clientX,e.clientY); });
document.addEventListener('contextmenu',e=>e.preventDefault());

// おしゃれ箱から取り出す
$('items').addEventListener('pointerdown',e=>{ const t=e.target.closest('.tile'); if(t&&!drag) startDrag(e,t.dataset.id); });
// 着ているものを持ち上げる（外して別の子へ・箱に戻すと消える）
stage.addEventListener('pointerdown',e=>{
  if(drag) return;
  const fs=e.target.closest('.fs');
  if(fs){ const j=+fs.dataset.j, k=state.free[j]; if(!k) return; state.free.splice(j,1); fs.style.visibility='hidden'; startDrag(e,k.id); return; }
  const w=e.target.closest('.worn'); if(!w) return;
  const i=+w.closest('svg').dataset.i, s=state.p[i];
  if(w.dataset.slot){ const name=w.dataset.slot, id=s[name]; if(!id) return; delete s[name];
    w.closest('svg').querySelectorAll(`[data-slot="${name}"]`).forEach(n=>n.style.visibility='hidden'); startDrag(e,id); }
  else if(w.dataset.stk!=null){ const j=+w.dataset.stk, k=s.stickers[j]; if(!k) return; s.stickers.splice(j,1); w.style.visibility='hidden'; startDrag(e,k.id); }
});


/* ---------- ボタン ---------- */
const PLAY_ICON=`<svg viewBox="0 0 20 20"><path d="M6,3.5 L16.5,10 L6,16.5Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
const STOP_ICON=`<svg viewBox="0 0 20 20"><rect x="4.5" y="4.5" width="11" height="11" rx="2.5" fill="#fff"/></svg>`;
function setPlay(on){ playing=on; $('app').classList.toggle('playing',on);
  $('play').innerHTML=on?STOP_ICON:PLAY_ICON; $('play').setAttribute('aria-label',on?'とまる':'おどる');
  if(on&&musicOn) scheduleSong(); else stopSong(); }
$('play').addEventListener('click',()=>{ audio(); setPlay(!playing); });
const NOTE_ICON=on=>`<svg viewBox="0 0 24 24"><path d="M9,18 V5 L19,3 V16" fill="none" stroke="#D9467F" stroke-width="2.4" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="3" fill="#D9467F"/><circle cx="16.5" cy="16" r="3" fill="#D9467F"/>${on?'':'<line x1="3" y1="3" x2="21" y2="21" stroke="#8A7A86" stroke-width="2.6" stroke-linecap="round"/>'}</svg>`;
$('music').innerHTML=NOTE_ICON(true);
$('reset').innerHTML=`<svg viewBox="0 0 24 24"><g class="lid"><rect x="4" y="5" width="16" height="2.6" rx="1.3" fill="#D9467F"/><rect x="9.5" y="2.6" width="5" height="3" rx="1.2" fill="none" stroke="#D9467F" stroke-width="1.8"/></g>
  <path d="M6,9 L7.2,20.5 Q7.4,22 9,22 L15,22 Q16.6,22 16.8,20.5 L18,9Z" fill="#FFC6DA" stroke="#D9467F" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M10,12 L10.4,19 M14,12 L13.6,19" stroke="#D9467F" stroke-width="1.6" stroke-linecap="round"/></svg>`;
$('music').addEventListener('click',()=>{ musicOn=!musicOn; const b=$('music'); b.innerHTML=NOTE_ICON(musicOn); b.setAttribute('aria-pressed',musicOn);
  if(playing){ if(musicOn) scheduleSong(); else stopSong(); } });
$('reset').addEventListener('click',()=>{ const b=$('reset'), r=b.getBoundingClientRect();
  state=blank(); renderAll(); save(); puff(); burst(r.left+r.width/2,r.top+r.height/2,10,'puff');
  b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); });

let rz=null; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ renderFree(); fitTiles(); },120); });

/* ---------- はじまり ---------- */
function start(data){
  if(data&&data.state) state=data.state; else load();
  buildLookDefs(); measureAll(); buildStage(); renderItems(); renderAll(); setView(0); setPlay(false);
  $('ptabs').addEventListener('click',e=>{ const b=e.target.closest('.ptab'); if(!b) return; audio(); const v=b.dataset.v; setView(v==='all'?'all':+v); });
  requestAnimationFrame(()=>{ renderFree(); fitTiles(); });
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({state}));
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
